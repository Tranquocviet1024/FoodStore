services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: foodstore-wp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: foodstore_wp
      MYSQL_USER: foodstore
      MYSQL_PASSWORD: foodstore123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - foodstore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WordPress
  wordpress:
    image: wordpress:6.4-php8.2-apache
    container_name: foodstore-wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: foodstore
      WORDPRESS_DB_PASSWORD: foodstore123
      WORDPRESS_DB_NAME: foodstore_wp
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: "true"
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/themes/foodstore:/var/www/html/wp-content/themes/foodstore
      - ./wp-content/plugins/foodstore-setup:/var/www/html/wp-content/plugins/foodstore-setup
      - ./wp-content/themes/foodstore/assets/images:/var/www/html/wp-content/themes/foodstore/assets/images
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - foodstore-network

  # phpMyAdmin (optional - for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: foodstore-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root123
    depends_on:
      - mysql
    networks:
      - foodstore-network

volumes:
  mysql_data:
  wordpress_data:

networks:
  foodstore-network:
    driver: bridge
